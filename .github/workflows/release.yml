name: Build and Release

on:
  workflow_dispatch:
    inputs:
      sqlite_version:
        description: 'SQLite Version (e.g. 3.54.1)'
        required: true
        default: '3.54.1'
      sqlite_year:
        description: 'SQLite Release Year (e.g. 2026)'
        required: true
        default: '2026'

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build SQLite WASI artifacts and npm package
        run: |
          ./scripts/build.sh "${{ inputs.sqlite_version }}" "${{ inputs.sqlite_year }}"

      - name: Verify package archive exists
        run: |
          VERSION="${{ inputs.sqlite_version }}"
          ARCHIVE="dist/sqlite-wasi-${VERSION}.tgz"
          if [ ! -f "${ARCHIVE}" ]; then
            echo "Error: Archive ${ARCHIVE} was not created!" >&2
            ls -la dist/
            exit 1
          fi
          echo "Package archive successfully created: ${ARCHIVE}"
          ls -lh "${ARCHIVE}"

      - name: Create GitHub Release and Upload Archive
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ inputs.sqlite_version }}"
          TAG="v${VERSION}"
          ARCHIVE="dist/sqlite-wasi-${VERSION}.tgz"

          # Create release if it does not exist, or upload to existing release
          if gh release view "${TAG}" >/dev/null 2>&1; then
            echo "Release ${TAG} exists. Uploading asset..."
            gh release upload "${TAG}" "${ARCHIVE}" --clobber
          else
            echo "Creating release ${TAG}..."
            gh release create "${TAG}" \
              "${ARCHIVE}" \
              --title "SQLite WASI v${VERSION}" \
              --notes "Precompiled SQLite ${VERSION} library and CLI for WASI Preview 1.

Package file: \`sqlite-wasi-${VERSION}.tgz\`

### Contents:
- **CLI Executable**: \`bin/sqlite3.wasm\`
- **Static Library**: \`lib/libsqlite3.a\`
- **C Headers**: \`include/sqlite3.h\`, \`include/sqlite3ext.h\`
- **JavaScript Runner**: \`bin/cli.js\` (runnable via \`npx sqlite-wasi\`)"
          fi
